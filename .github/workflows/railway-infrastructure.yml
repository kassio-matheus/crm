name: Railway infrastructure

on:
  pull_request:
    paths:
      - '.railway/**'
      - 'deploy/**'
      - 'scripts/*railway*.mjs'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/railway-infrastructure.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck:deployment
      - run: yarn test:deployment
      - name: Rehearse a fresh isolated Docker stack
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: yarn test:deployment:docker
